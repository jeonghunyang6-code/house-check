# K-apt 단지 정보 수집과 실거래 단지 연결 (jobs/kapt.py).
# 매일 목록·기본 정보(새 단지만)·상세 정보(역·도보 시간, 0021)·연결을 갱신한다. 상세 정보는 하루 한도 때문에 처음 약 1만 단지를 며칠에 나눠 받는다. 처음 한 번은 수동으로 complexes → list → info → match 순서로 돌린다.
# 기본 정보는 단지마다 1회 호출이라 수도권 전체(약 1만 단지)는 하루 호출 한도를 넘을 수 있다 → 한도 초과면 멈추고 다음 실행이 이어서 한다.
name: kapt

on:
  schedule:
    - cron: "37 18 * * *"   # 매일 03:37 KST (상세 정보 밀린 것을 한도만큼씩. 다 받으면 새 단지만 부르므로 호출이 거의 없다)
  workflow_dispatch:
    inputs:
      steps:
        description: "실행할 단계 (쉼표): complexes,list,info,detail,match"
        default: "list,info,match,detail"
      regions:
        description: "seoul | gyeonggi | incheon | sudogwon"
        default: "sudogwon"
      months:
        description: "complexes 단계가 훑을 계약월"
        default: "202001-202608"

permissions:
  contents: read

concurrency:
  # kapt_complexes·complexes(속성 upsert)만 쓴다. 매일 수집·백필과 같은 줄에 서면 몇 시간씩 밀려서(2026-10-13) 따로 줄을 선다.
  # complexes 는 매일 수집도 upsert 하지만 같은 값(단지 속성)을 COALESCE 로 덮어써 겹쳐도 안전하다
  group: kapt
  cancel-in-progress: false

jobs:
  kapt:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: psql 확인
        run: command -v psql || (sudo apt-get update -q && sudo apt-get install -y -q postgresql-client)
      - name: 실행
        env:
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          HC_DB_BACKEND: psql
          HC_PAGE_SIZE: "1000"
          PYTHONUNBUFFERED: "1"
          STEPS: ${{ inputs.steps || 'list,info,match,detail' }}
          REGIONS: ${{ inputs.regions || 'sudogwon' }}
          MONTHS: ${{ inputs.months || '202001-202608' }}
        run: |
          rc=0
          for s in ${STEPS//,/ }; do
            case "$s" in
              complexes|list|info|detail|match) ;;
              *) echo "알 수 없는 단계: $s"; exit 1 ;;
            esac
            python -m jobs.kapt "$s" --regions "$REGIONS" --months "$MONTHS" || rc=$?
            [ "$rc" -eq 2 ] && break   # 호출 한도 초과, 공공데이터포털 연속 접속 실패(Unreachable), 또는 info 연속 실패가 쉬어도 안 풀림
          done
          exit $rc
