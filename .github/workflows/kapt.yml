# K-apt 단지 정보 수집과 실거래 단지 연결 (jobs/kapt.py).
# 매주 일요일 목록·기본 정보(새 단지만)·연결을 갱신한다. 처음 한 번은 수동으로 complexes → list → info → match 순서로 돌린다.
# 기본 정보는 단지마다 1회 호출이라 수도권 전체(약 1만 단지)는 하루 호출 한도를 넘을 수 있다 → 한도 초과면 멈추고 다음 실행이 이어서 한다.
name: kapt

on:
  schedule:
    - cron: "37 18 * * 0"   # 일요일 03:37 KST
  workflow_dispatch:
    inputs:
      steps:
        description: "실행할 단계 (쉼표): complexes,list,info,match"
        default: "list,info,match"
      regions:
        description: "seoul | gyeonggi | incheon | sudogwon"
        default: "sudogwon"
      months:
        description: "complexes 단계가 훑을 계약월"
        default: "202001-202608"

permissions:
  contents: read

concurrency:
  group: daily-snapshot  # DB 를 쓰는 다른 작업과 겹치지 않게
  cancel-in-progress: false

jobs:
  kapt:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: psql 확인
        run: command -v psql || (sudo apt-get update -q && sudo apt-get install -y -q postgresql-client)
      - name: 실행
        env:
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          HC_DB_BACKEND: psql
          HC_PAGE_SIZE: "1000"
          PYTHONUNBUFFERED: "1"
          STEPS: ${{ inputs.steps || 'list,info,match' }}
          REGIONS: ${{ inputs.regions || 'sudogwon' }}
          MONTHS: ${{ inputs.months || '202001-202608' }}
        run: |
          rc=0
          for s in ${STEPS//,/ }; do
            case "$s" in
              complexes|list|info|match) ;;
              *) echo "알 수 없는 단계: $s"; exit 1 ;;
            esac
            python -m jobs.kapt "$s" --regions "$REGIONS" --months "$MONTHS" || rc=$?
            [ "$rc" -eq 2 ] && break   # 호출 한도 초과
          done
          exit $rc
