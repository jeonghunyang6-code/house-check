name: probe-tmp
# 임시 (브랜치에서만): 빠진 역 파일 재시도, 병원·학원 출처 확인. PR 전에 지운다
on:
  push:
    branches: [claude/brave-lamport-gkzeao]
    paths: [.github/workflows/probe_tmp.yml, tools/probe/**]
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - run: python3 tools/probe/infra4.py
        env:
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
          PYTHONUNBUFFERED: "1"
