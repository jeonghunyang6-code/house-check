name: vworld-probe
on:
  push:
    branches: [claude/brave-lamport-gkzeao]
    paths: [tools/probe/vworld_probe.py, .github/workflows/vworld_probe.yml]
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - run: python3 tools/probe/vworld_probe.py
        env:
          SGIS_CONSUMER_KEY: ${{ secrets.SGIS_CONSUMER_KEY }}
          SGIS_CONSUMER_SECRET: ${{ secrets.SGIS_CONSUMER_SECRET }}
