# 텔레그램 알림 (jobs/notify.py). 필요한 시크릿: TELEGRAM_BOT_TOKEN(@BotFather 로 만든 봇), DATABASE_URL.
# 대화 번호는 봇에게 한 번 말을 걸어 두면 첫 실행 때 찾아 DB 에 저장한다. 변수 HC_SITE_URL 이 있으면 글 끝에 웹 주소
# 매일: 수집(daily-snapshot)이 끝나면 관심 단지 새 실거래. 금요일 19:07 KST: 주간 요약. 22~07시는 보내지 않음
name: notify

on:
  workflow_run:
    workflows: [daily-snapshot]
    types: [completed]
  schedule:
    - cron: "7 10 * * 5"   # 금 19:07 KST
  workflow_dispatch:
    inputs:
      mode:
        description: "daily | weekly | test"
        default: "test"

permissions:
  contents: read

concurrency:
  group: notify
  cancel-in-progress: false

jobs:
  notify:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: psql 확인
        run: command -v psql || (sudo apt-get update -q && sudo apt-get install -y -q postgresql-client)
      - name: 알림
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          HC_SITE_URL: ${{ vars.HC_SITE_URL }}
          HC_DB_BACKEND: psql
          PYTHONUNBUFFERED: "1"
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ]; then echo "TELEGRAM_BOT_TOKEN 없음 → 건너뜀"; exit 0; fi
          MODE="${{ inputs.mode }}"
          if [ -z "$MODE" ]; then
            if [ "${{ github.event_name }}" = "schedule" ]; then MODE=weekly; else MODE=daily; fi
          fi
          python -m jobs.notify "$MODE"
