# B5 ② 과거 시계열 (jobs/b5_history.py): 보관 파일 + DB 로 2021년 이후 월별 하위 급지 신고가 비중을 계산해 b5_history 에 쓴다. 수동 실행.
# DB 는 읽기 + b5_history(월 80행 안팎)만 쓴다.
name: b5-history

on:
  workflow_dispatch:

permissions:
  contents: read   # 릴리스 자산 내려받기

concurrency:
  group: b5-history
  cancel-in-progress: false

jobs:
  b5:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: psql 확인
        run: command -v psql || (sudo apt-get update -q && sudo apt-get install -y -q postgresql-client)
      - name: 실행
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          HC_DB_BACKEND: psql
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PYTHONUNBUFFERED: "1"
        run: python -m jobs.b5_history --archive gh
