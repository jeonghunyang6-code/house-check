# B5 ② 과거 시계열 (jobs/b5_history.py): 2020년 이후 거래의 전고점을 다시 계산하고 월별로 집계한다. 수동 실행.
# deals.prev_high_10k 를 쓰므로 매일 수집(metrics)과 같은 줄에 선다.
name: b5-history

on:
  workflow_dispatch:
    inputs:
      steps:
        description: "prev,agg | agg"
        default: "prev,agg"
      regions:
        description: "prev 단계 범위: sudogwon | seoul | gyeonggi | incheon | 코드 목록"
        default: "sudogwon"

permissions:
  contents: read

concurrency:
  group: daily-snapshot
  cancel-in-progress: false

jobs:
  b5:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: psql 확인
        run: command -v psql || (sudo apt-get update -q && sudo apt-get install -y -q postgresql-client)
      - name: 실행
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          HC_DB_BACKEND: psql
          PYTHONUNBUFFERED: "1"
          STEPS: ${{ inputs.steps || 'prev,agg' }}
          REGIONS: ${{ inputs.regions || 'sudogwon' }}
        run: |
          for s in ${STEPS//,/ }; do
            case "$s" in prev|agg) ;; *) echo "알 수 없는 단계: $s"; exit 1 ;; esac
            python -m jobs.b5_history "$s" --regions "$REGIONS" || exit $?
          done
