# 임시: 서울 열린데이터광장 정비사업 데이터셋의 오픈 API 서비스명·항목 확인 (클라우드 세션에서 data.seoul.go.kr 이 막혀 러너에서 본다). 확인 뒤 지운다.
name: probe-seoul
on:
  push:
    branches: [claude/busy-meitner-ojizbi]
    paths: [.github/workflows/probe-seoul.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: API 상세 페이지·파일 목록
        run: |
          for oa in OA-2253 OA-22856; do
            for u in "https://data.seoul.go.kr/dataList/openApiView.do?infId=$oa&srvType=A" \
                     "https://data.seoul.go.kr/dataList/$oa/A/1/datasetView.do" \
                     "https://data.seoul.go.kr/dataList/$oa/F/1/datasetView.do"; do
              h=$(curl -sS -m 30 -L "$u" || true)
              echo "== $u ($(echo "$h" | wc -c) bytes)"
              echo "$h" | grep -oE "8088/[^\"' <]{0,80}" | sort -u | head -8
              echo "$h" | grep -oE "(srvcId|seq|fileSeq|infSeq|svcNm|SERVICE)[\"'= :]+[A-Za-z0-9_.-]{2,40}" | sort -u | head -10
              echo "$h" | grep -oE "[가-힣A-Za-z0-9_ ()]{0,30}\.(csv|xlsx|xls)" | sort -u | head -8
              echo "$h" | grep -oE "최종수정일자[^<]{0,40}|수정일[^<]{0,30}|갱신주기[^<]{0,30}" | head -3
            done
          done
      - name: 서비스 호출
        env:
          K: ${{ secrets.SEOUL_API_KEY }}
        run: |
          for svc in upisRebuild CleanupBussinessInfo GetCleanupBusinessInfo ReconstructionInfo cleanupBussinessInfo; do
            r=$(curl -sS -m 30 "http://openapi.seoul.go.kr:8088/$K/json/$svc/1/1/" || true)
            echo "== $svc: $(echo "$r" | head -c 300)"
          done
          r=$(curl -sS -m 60 "http://openapi.seoul.go.kr:8088/$K/json/upisRebuild/1/1000/" || true)
          echo "$r" | python3 -c "
          import json,sys,collections
          d=json.load(sys.stdin)['upisRebuild']; rows=d['row']
          print('cols', list(rows[0].keys()))
          print(collections.Counter((r['MCLSF'], r['SCLSF']) for r in rows).most_common(15))
          print(collections.Counter(r['RPT_TYPE'] for r in rows).most_common(8))
          for r in rows[-3:]: print(r)
          "
