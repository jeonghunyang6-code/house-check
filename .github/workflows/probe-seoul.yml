# 임시: 서울 열린데이터광장 정비사업 데이터셋의 오픈 API 서비스명·항목 확인 (클라우드 세션에서 data.seoul.go.kr 이 막혀 러너에서 본다). 확인 뒤 지운다.
name: probe-seoul
on:
  push:
    branches: [claude/busy-meitner-ojizbi]
    paths: [.github/workflows/probe-seoul.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: TbSeoulRedevStatus
        env:
          K: ${{ secrets.SEOUL_API_KEY }}
        run: |
          curl -sS -m 60 "http://openapi.seoul.go.kr:8088/$K/json/TbSeoulRedevStatus/1/1000/" -o a.json || true
          curl -sS -m 60 "http://openapi.seoul.go.kr:8088/$K/json/TbSeoulRedevStatus/1001/2000/" -o b.json || true
          python3 - <<'PY'
          import json, collections
          d = json.load(open('a.json'))
          k = next(iter(d)); x = d[k]
          print('keys', k, {kk: v for kk, v in x.items() if kk != 'row'})
          rows = x.get('row', [])
          try: rows += json.load(open('b.json'))[k].get('row', [])
          except Exception as e: print('b', e)
          print('n', len(rows)); print('cols', list(rows[0].keys()) if rows else None)
          for c in rows[0].keys():
              vals = collections.Counter(str(r[c]) for r in rows)
              print(c, len(vals), vals.most_common(6))
          for r in rows[:3]: print(r)
          am = [r for r in rows if any('아파트' in str(v) or '재건축' in str(v) for v in r.values())][:5]
          for r in am: print('APT', r)
          PY
