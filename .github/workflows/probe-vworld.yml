# 임시: VWORLD_API_KEY 시크릿이 있는지, 러너에서 VWorld 토지특성(대지면적)이 받아지는지 확인. 확인 뒤 지운다.
name: probe-vworld
on:
  push:
    branches: [claude/busy-meitner-ojizbi]
    paths: [.github/workflows/probe-vworld.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: VWorld 토지특성
        env:
          K: ${{ secrets.VWORLD_API_KEY }}
        run: |
          [ -n "$K" ] && echo "VWORLD_API_KEY 있음 (길이 ${#K})" || { echo "VWORLD_API_KEY 없음"; exit 0; }
          # 은마(대치동 316), 산본퇴계(금정동 875), 헬리오시티(가락동 913)
          for pnu in 1168010600103160000 4141010500108750000 1171010700109130000; do
            for yr in 2025 2024; do
              r=$(curl -sS -m 40 "https://api.vworld.kr/ned/data/getLandCharacteristics?key=$K&pnu=$pnu&stdrYear=$yr&format=json&numOfRows=5&pageNo=1&domain=github.com" || echo CURL_FAIL)
              echo "== $pnu $yr: $(echo "$r" | python3 -c "
          import json,sys
          t=sys.stdin.read()
          try:
              d=json.loads(t); f=d.get('landCharacteristicss',{}).get('field',[])
              print([(x.get('lndpclAr'), x.get('ladUseSittnNm'), x.get('prposArea1Nm'), x.get('pblntfPclnd')) for x in f][:3] or t[:300])
          except Exception: print(t[:300])
          ")"
            done
          done
