# 경매 낙찰가율 G6 (jobs/auction.py): 지지옥션 월간 경매동향 기사(네이버 뉴스 검색) → auction_stats.
# 기사는 매달 초에 나와 7일·14일 두 번 돈다. 저장소 Secrets 에 NAVER_CLIENT_ID·NAVER_CLIENT_SECRET 이 있어야 한다.
name: auction

on:
  schedule:
    - cron: "23 0 7,14 * *"   # 매달 7·14일 09:23 KST
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: auction
  cancel-in-progress: false

jobs:
  auction:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: psql 확인
        run: command -v psql || (sudo apt-get update -q && sudo apt-get install -y -q postgresql-client)
      - name: 낙찰가율
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          HC_DB_BACKEND: psql
          PYTHONUNBUFFERED: "1"
        run: python -m jobs.auction --backfill 2
