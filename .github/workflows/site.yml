# 웹 화면 배포: 매일 수집(daily-snapshot)이 끝나면 시안 v2 를 오늘 데이터로 다시 만들어 Vercel 에 올린다.
# 필요한 시크릿: VERCEL_TOKEN(Vercel 계정 토큰), HC_KEY(사용자가 정한 비밀 문구 — 웹 주소?k=문구 로 한 번 열면 기록이 서버에 저장), DATABASE_URL
# 첫 배포 때 Vercel 에 'house-check' 프로젝트가 저절로 생긴다. 주소는 로그의 'Production' 줄, DB user_state 'site_url' 에도 저장
name: site

on:
  workflow_run:
    workflows: [daily-snapshot]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site
  cancel-in-progress: true

jobs:
  site:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: psql 확인
        run: command -v psql || (sudo apt-get update -q && sudo apt-get install -y -q postgresql-client)
      - name: 보관 파일(옛 거래·전세 요약)
        env:
          GH_TOKEN: ${{ github.token }}
        run: mkdir -p hist && gh release download raw-data --repo "$GITHUB_REPOSITORY" -p 'deals_hist_*' -p 'rentsum_*' -D hist && ls hist | wc -l
      - name: 화면 만들기
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          HC_DB_BACKEND: psql
          HC_ARCHIVE: dir:hist
          PYTHONUNBUFFERED: "1"
        run: |
          python tools/prototype/extract.py > /dev/null
          python tools/prototype/compute.py > /dev/null
          python tools/prototype/build_v2.py --web house-check
          ls -la house-check
      - name: Vercel 배포
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          HC_KEY: ${{ secrets.HC_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$HC_KEY" ]; then echo "VERCEL_TOKEN·HC_KEY 없음 → 배포 건너뜀"; exit 0; fi
          cd house-check
          npx --yes vercel@latest deploy --prod --yes --token "$VERCEL_TOKEN" -e DATABASE_URL="$DATABASE_URL" -e HC_KEY="$HC_KEY" 2>&1 | tee ../deploy.log
          URL=$(grep -oE 'https://[a-z0-9.-]+\.vercel\.app' ../deploy.log | grep -v -- '-[a-z0-9]\{9\}-' | tail -1)
          [ -z "$URL" ] && URL=$(grep -oE 'https://[a-z0-9.-]+\.vercel\.app' ../deploy.log | tail -1)
          echo "주소: $URL"
          if [ -n "$URL" ]; then psql "$DATABASE_URL" -qc "INSERT INTO user_state (k, v) VALUES ('site_url', to_jsonb('$URL'::text)) ON CONFLICT (k) DO UPDATE SET v = EXCLUDED.v, updated_at = now();"; fi
