# 웹 화면 배포: 매일 수집(daily-snapshot)이 끝나면 시안 v2 를 오늘 데이터로 다시 만들어 Vercel 에 올린다.
# 필요한 시크릿: VERCEL_TOKEN(Vercel 계정 토큰), HC_KEY(사용자가 정한 비밀 문구 — 웹 주소?k=문구 로 한 번 열면 기록이 서버에 저장), DATABASE_URL
# 첫 배포 때 Vercel 에 'house-check' 프로젝트가 저절로 생긴다. 주소는 로그의 'Production' 줄, DB user_state 'site_url' 에도 저장
name: site

on:
  workflow_run:
    workflows: [daily-snapshot]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site
  cancel-in-progress: true

jobs:
  site:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: psql 확인
        run: command -v psql || (sudo apt-get update -q && sudo apt-get install -y -q postgresql-client)
      - name: 보관 파일(옛 거래·전세 요약)
        env:
          GH_TOKEN: ${{ github.token }}
        run: mkdir -p hist && gh release download raw-data --repo "$GITHUB_REPOSITORY" -p 'deals_hist_*' -p 'rentsum_*' -D hist && ls hist | wc -l
      - name: 화면 만들기
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          HC_DB_BACKEND: psql
          HC_ARCHIVE: dir:hist
          HC_MAPKEY: ${{ secrets.NCP_MAPS_KEY_ID }}   # 네이버 지도(Dynamic Map) Client ID: 원래 페이지에 공개되는 값, 콘솔에 등록한 사이트 주소에서만 작동
          PYTHONUNBUFFERED: "1"
        run: |
          python tools/prototype/extract.py > /dev/null
          python tools/prototype/compute.py > /dev/null
          python tools/prototype/build_v2.py --web house-check
          ls -la house-check
      - name: 화면 점검(배포 전, 실패하면 배포 안 함 → 어제 사이트 그대로)
        run: |
          npm i --no-save --silent --prefix "$RUNNER_TEMP/pw" playwright@1.56.1
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium > /dev/null
          NODE_PATH="$RUNNER_TEMP/pw/node_modules" node tools/prototype/smoke.js house-check
      - name: Vercel 배포
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          HC_KEY: ${{ secrets.HC_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$HC_KEY" ]; then echo "VERCEL_TOKEN·HC_KEY 없음 → 배포 건너뜀"; exit 0; fi
          cd house-check
          npx --yes vercel@latest deploy --prod --yes --token "$VERCEL_TOKEN" -e DATABASE_URL="$DATABASE_URL" -e HC_KEY="$HC_KEY" 2>&1 | tee ../deploy.log
          URL=$(grep -oE 'https://[a-z0-9.-]+\.vercel\.app' ../deploy.log | grep -v -- '-[a-z0-9]\{9\}-' | tail -1)
          [ -z "$URL" ] && URL=$(grep -oE 'https://[a-z0-9.-]+\.vercel\.app' ../deploy.log | tail -1)
          echo "주소: $URL"
          if [ -n "$URL" ]; then psql "$DATABASE_URL" -qc "INSERT INTO user_state (k, v) VALUES ('site_url', to_jsonb('$URL'::text)) ON CONFLICT (k) DO UPDATE SET v = EXCLUDED.v, updated_at = now();"; fi
          [ -z "$URL" ] && exit 0
          # 사용자 결정 '로그인 없이': Vercel 로그인 보호(Deployment Protection)가 켜져 있으면 끈다. 개인 기록은 HC_KEY 로 따로 보호
          CODE=$(curl -s -o /dev/null -w '%{http_code}' "$URL/")
          echo "첫 화면 응답: $CODE"
          if [ "$CODE" = "401" ] || [ "$CODE" = "403" ]; then
            ORG=$(jq -r .orgId .vercel/project.json); PID=$(jq -r .projectId .vercel/project.json)
            curl -s -X PATCH "https://api.vercel.com/v9/projects/$PID?teamId=$ORG" -H "Authorization: Bearer $VERCEL_TOKEN" -H "Content-Type: application/json" \
              -d '{"ssoProtection":null}' -o /dev/null -w "로그인 보호 끄기: %{http_code}\n"
            sleep 5
            echo "다시: $(curl -s -o /dev/null -w '%{http_code}' "$URL/")"
          fi
          echo "저장 API(문구 없음, 401 이어야): $(curl -s -o /dev/null -w '%{http_code}' "$URL/api/state")"
          echo "저장 API(문구, 200 이어야): $(curl -s -o /dev/null -w '%{http_code}' -H "x-hc-key: $HC_KEY" "$URL/api/state")"
