# 한국부동산원 R-ONE 주간 아파트 가격동향 (jobs/rone.py).
# 주간 동향은 매주 목요일 발표로 알고 있으나 발표 시각은 확인하지 못했다 → 목·금 두 번 돈다. 받은 주는 건너뛴다.
# 처음 한 번은 수동 실행으로 mode=backfill (2012년~ 전체 시계열, 약 300회 호출).
name: rone

on:
  schedule:
    - cron: "47 8 * * 4"   # 목 17:47 KST
    - cron: "47 8 * * 5"   # 금 17:47 KST (목요일에 못 받았을 때)
  workflow_dispatch:
    inputs:
      mode:
        description: "weekly | backfill | breadth"
        default: "weekly"

permissions:
  contents: read

concurrency:
  group: rone  # rone_* 표만 쓰므로 매일 수집·kapt 와 동시에 돌아도 된다
  cancel-in-progress: false

jobs:
  rone:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: psql 확인
        run: command -v psql || (sudo apt-get update -q && sudo apt-get install -y -q postgresql-client)
      - name: 실행
        env:
          RONE_API_KEY: ${{ secrets.RONE_API_KEY }}
          KOSIS_API_KEY: ${{ secrets.KOSIS_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          HC_DB_BACKEND: psql
          PYTHONUNBUFFERED: "1"
          MODE: ${{ inputs.mode || 'weekly' }}
        run: |
          case "$MODE" in weekly|backfill|breadth) ;; *) echo "알 수 없는 mode: $MODE"; exit 1 ;; esac
          rc=0
          python -m jobs.rone "$MODE" || rc=$?
          python -m jobs.macro || rc=$?    # 거시 월별 지표 (macro_monthly: 계절조정 실업률)
          python -m jobs.market || rc=$?   # 국면·체크리스트 신호 (region_phase, market_signals)
          exit $rc
