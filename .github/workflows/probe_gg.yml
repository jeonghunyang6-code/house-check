name: probe_gg
# 임시: 경기데이터드림(경기 정비사업) 접속 확인. 머지 전에 지운다
on:
  workflow_dispatch:
  push:
    branches: [claude/busy-meitner-ojizbi]
    paths: [.github/workflows/probe_gg.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 접속 확인
        run: |
          set +e
          I=S62GFEEN7JMLMA0PH6CF19108891
          for q in "portal/data/service/selectServicePage.do?infId=$I&infSeq=1" "portal/data/service/selectServicePage.do?infId=$I&infSeq=3" "portal/data/service/selectServicePage.do?page=1&infId=$I&infSeq=3" ; do
            echo "=== $q"; curl -s -m 60 -A 'house-check (personal research)' -L "https://data.gg.go.kr/$q" -o p.html; wc -c p.html
            head -c 600 p.html; echo
            grep -o 'openapi.gg.go.kr/[A-Za-z0-9_]*' p.html | sort -u
            grep -o 'https://openapi[^"<> ]*' p.html | sort -u | head
          done
          echo "=== openapi root"; curl -s -m 30 https://openapi.gg.go.kr/ | head -c 800; echo
