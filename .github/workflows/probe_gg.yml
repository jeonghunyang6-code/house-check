name: probe_gg
# 임시: 경기데이터드림(경기 정비사업) 접속 확인. 머지 전에 지운다
on:
  workflow_dispatch:
  push:
    branches: [claude/busy-meitner-ojizbi]
    paths: [.github/workflows/probe_gg.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 접속 확인
        run: |
          set +e
          I=S62GFEEN7JMLMA0PH6CF19108891
          curl -s -m 60 -A 'house-check (personal research)' "https://data.gg.go.kr/portal/data/service/selectServicePage.do?infId=$I&infSeq=1" -o p.html
          echo "== .do 경로"; grep -o '/portal/[A-Za-z0-9/_]*\.do' p.html | sort | uniq -c | sort -rn | head -40
          echo "== download·sheet·file 문맥"; grep -o -i '.\{0,120\}\(download\|sheet\|fileSeq\|srvCd\|openapi\).\{0,160\}' p.html | grep -v '^\s*$' | head -40
          echo "== 표 머리"; grep -o '<th[^>]*>[^<]\{1,40\}</th>' p.html | head -60
