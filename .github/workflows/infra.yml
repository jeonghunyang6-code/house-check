# 생활 인프라 (jobs/infra.py): 역 위치·초등 통학구역·중학교 학교군·동별 학원 수·병원 → 단지 연결. 가끔(분기) 수동 실행.
# 공원(park)만 분기마다 자동(2026-11-12 사용자 요청): 전국도시공원정보표준데이터는 매달 초 갱신 → 1·4·7·10월 5일 새벽
name: infra

on:
  schedule:
    - cron: "43 19 4 1,4,7,10 *"   # 1·4·7·10월 5일 04:43 KST, mode = park
  workflow_dispatch:
    inputs:
      mode:
        description: "stations | schoolzone | midzone | elem | academy | hospital | park | access (mart 는 커넥터로 모은 파일이 필요해 로컬에서)"
        default: "schoolzone"

permissions:
  contents: read

concurrency:
  group: infra-${{ inputs.mode || 'park' }}
  cancel-in-progress: false

jobs:
  infra:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: 공간 라이브러리
        run: pip install -q pyproj pyshp shapely
      - name: psql 확인
        run: command -v psql || (sudo apt-get update -q && sudo apt-get install -y -q postgresql-client)
      - name: 실행
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEIS_API_KEY: ${{ secrets.NEIS_API_KEY }}
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
          SCHOOLINFO_API_KEY: ${{ secrets.SCHOOLINFO_API_KEY }}
          HC_DB_BACKEND: psql
          PYTHONUNBUFFERED: "1"
        run: python -m jobs.infra "${{ inputs.mode || 'park' }}"
