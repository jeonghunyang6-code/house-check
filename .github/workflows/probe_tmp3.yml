# 임시(PR 전에 삭제): 0039·0040 적용, rent_j24 계산, 지표 재계산. 앞선 probe_tmp2 가 끝난 뒤 돈다
name: probe-tmp3
on:
  push:
    branches: [claude/brave-lamport-gkzeao]
    paths: [.github/workflows/probe_tmp3.yml]
permissions:
  contents: read
  actions: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: command -v psql || (sudo apt-get update -q && sudo apt-get install -y -q postgresql-client)
      - env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          HC_DB_BACKEND: psql
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PYTHONUNBUFFERED: "1"
        run: |
          until [ "$(gh api repos/$GH_REPO/actions/runs/39139656764 --jq .status)" = completed ]; do sleep 60; done
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -1 -f db/migrations/0039_rent_j24.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -1 -f db/migrations/0040_ref_spread.sql
          python -m jobs.rent_archive j24 --archive gh
          python -m jobs.metrics
          python -m jobs.market
          psql "$DATABASE_URL" -At -c "SELECT 'j24', count(*) FILTER (WHERE jeonse_24m_approx), count(*) FILTER (WHERE NOT jeonse_24m_approx), count(*) FILTER (WHERE reverse_risk) FROM complex_metrics"
          psql "$DATABASE_URL" -At -c "SELECT 'src', jeonse_src, count(*) FROM complex_metrics GROUP BY 2"
          psql "$DATABASE_URL" -At -c "SELECT 'spread', count(*) FILTER (WHERE ref_lo_10k IS NOT NULL), sum(ref_floor1_n), percentile_cont(0.5) WITHIN GROUP (ORDER BY (ref_hi_10k - ref_lo_10k)::numeric / nullif(ref_10k, 0)) FROM complex_metrics"
          psql "$DATABASE_URL" -At -c "SELECT key, value, state, detail FROM market_signals WHERE key = 'a4_quick_sale'"
