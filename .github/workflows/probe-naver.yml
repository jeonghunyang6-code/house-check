# 임시: GitHub 의 NAVER_CLIENT_ID·SECRET 으로 데이터랩 검색어 트렌드·뉴스 검색이 되는지 확인. 확인 뒤 지운다.
name: probe-naver
on:
  push:
    branches: [claude/busy-meitner-ojizbi]
    paths: [.github/workflows/probe-naver.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: 네이버 API
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        run: |
          python3 - <<'PY'
          import os, json, urllib.request, urllib.error, urllib.parse
          i, s = os.environ.get("NAVER_CLIENT_ID", ""), os.environ.get("NAVER_CLIENT_SECRET", "")
          print("id len", len(i), "secret len", len(s))
          h = {"X-Naver-Client-Id": i, "X-Naver-Client-Secret": s}
          def go(req, label):
              try:
                  d = json.loads(urllib.request.urlopen(req, timeout=30).read().decode()); print(label, "OK", json.dumps(d, ensure_ascii=False)[:400])
              except urllib.error.HTTPError as e:
                  print(label, e.code, e.read().decode(errors="replace")[:200])
          go(urllib.request.Request("https://openapi.naver.com/v1/search/news.json?" + urllib.parse.urlencode({"query": "아파트", "display": 1}), headers=h), "news")
          body = {"startDate": "2025-07-01", "endDate": "2026-09-30", "timeUnit": "month",
                  "keywordGroups": [{"groupName": "은마", "keywords": ["은마아파트"]}, {"groupName": "헬리오시티", "keywords": ["헬리오시티"]}]}
          go(urllib.request.Request("https://openapi.naver.com/v1/datalab/search", data=json.dumps(body).encode(), method="POST",
                                    headers={**h, "Content-Type": "application/json"}), "datalab")
          PY
