# R9 인지도: 네이버 데이터랩 검색량 (jobs/searchtrend.py → complex_search). 매달 초 받는다(이번 달 받은 단지는 건너뜀, 6,145곳 ≈ 1,540회).
# 필요한 시크릿: NAVER_CLIENT_ID·NAVER_CLIENT_SECRET = NAVER API HUB(네이버 클라우드) 앱의 API KEY ID·KEY, 그 앱에 '검색어 트렌드' 활성화. DATABASE_URL
name: searchtrend

on:
  schedule:
    - cron: "13 20 2 * *"   # 매달 3일 05:13 KST
  workflow_dispatch:
    inputs:
      limit:
        description: "요청 수 (월 50,000)"
        default: "2000"

permissions:
  contents: read

concurrency:
  group: searchtrend
  cancel-in-progress: false

jobs:
  searchtrend:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: psql 확인
        run: command -v psql || (sudo apt-get update -q && sudo apt-get install -y -q postgresql-client)
      - name: 검색량
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          HC_DB_BACKEND: psql
          PYTHONUNBUFFERED: "1"
        run: python -m jobs.searchtrend --limit "${{ inputs.limit || '2000' }}"
