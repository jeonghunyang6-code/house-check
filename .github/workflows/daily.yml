# 일일 실거래 스냅샷 (jobs/daily.py). 스케줄은 기본 브랜치(main)에 있어야 실행된다.
# 이 저장소의 기본 브랜치는 claude/inspiring-bell-73ixlm 이다 (main 없음).
# 매매·전월세 모두 당월·전월만 받는다. 전월세는 범위를 벗어난 달을 GitHub Releases(raw-data)의 CSV.gz 로 옮기고
# DB 에서 지운다(jobs/rent_archive.py daily). 매매·전월세 모두 2~11개월 전 한 달을 날마다 돌아가며 다시 받아
# 늦은 해제·신고를 반영한다(jobs/daily.recheck_month). 그래서 이 워크플로는 contents: write 권한이 필요하다.
# 06:00 KST = 21:00 UTC 전날. 정각 혼잡을 피해 20:47 UTC 로 둔다. GitHub cron 은 수십 분 늦을 수 있다.
# 필요한 저장소 시크릿: DATA_GO_KR_SERVICE_KEY, DATABASE_URL (Supabase Session pooler, 5432)
# 러너에서 Supabase 직접 접속(psql)은 아직 실제로 검증하지 못했다. 첫 실행은 수동(workflow_dispatch)으로 확인할 것.
name: daily-snapshot

on:
  schedule:
    - cron: "47 20 * * *"
  workflow_dispatch:
    inputs:
      regions:
        description: "sudogwon | seoul | gyeonggi | incheon | 코드 목록"
        default: "sudogwon"
      dry_run:
        description: "DB 에 쓰지 않고 API 만 확인"
        type: boolean
        default: false

permissions:
  contents: write  # 릴리스 자산(원본 보관 파일) 업로드

concurrency:
  group: daily-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: psql 확인
        run: |
          command -v psql || (sudo apt-get update -q && sudo apt-get install -y -q postgresql-client)
          psql --version
      - name: 수집
        env:
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          HC_DB_BACKEND: psql
          PYTHONUNBUFFERED: "1"
          REGIONS: ${{ inputs.regions || 'sudogwon' }}
          DRY_RUN: ${{ inputs.dry_run && '--dry-run' || '' }}
        run: python -m jobs.daily --regions "$REGIONS" $DRY_RUN
      - name: 전월세 원본 보관·요약·재확인
        if: ${{ !cancelled() && !inputs.dry_run }}
        env:
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          HC_DB_BACKEND: psql
          HC_ARCHIVE: gh
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PYTHONUNBUFFERED: "1"
        run: python -m jobs.rent_archive daily
      - name: 매매 원본 보관 (2년 지난 달)
        if: ${{ !cancelled() && !inputs.dry_run }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          HC_DB_BACKEND: psql
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PYTHONUNBUFFERED: "1"
        run: python -m jobs.deal_archive roll --archive gh   # 저장 구조 C: DB 에는 최근 25개월만
      - name: 단지 지표 계산
        if: ${{ !cancelled() && !inputs.dry_run }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          HC_DB_BACKEND: psql
          PYTHONUNBUFFERED: "1"
        run: python -m jobs.metrics
      - name: 신고 지연 보정 거래량 (C1)
        if: ${{ !cancelled() && !inputs.dry_run }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          HC_DB_BACKEND: psql
          PYTHONUNBUFFERED: "1"
        run: python -m jobs.volume
      - name: 빈 공간 정리 (지표 표)
        # metrics 가 두 표를 여러 번 통째로 UPDATE 해서 빈 공간이 하루 수십 MB 쌓인다(2026-10-19 complex_metrics 9→50MB).
        # 무료 한도 500MB 를 지키려고 매일 다시 쓴다. 두 표 합 약 25MB 라 몇 초면 끝난다
        if: ${{ !cancelled() && !inputs.dry_run }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "VACUUM FULL complex_metrics" -c "VACUUM FULL complexes"
