# 일일 실거래 스냅샷 (jobs/daily.py). 스케줄은 기본 브랜치(main)에 있어야 실행된다.
# 이 저장소의 기본 브랜치는 claude/inspiring-bell-73ixlm 이다 (main 없음).
# 매매·전월세 모두 당월·전월만 DB 에 넣는다. 전월세는 지난 달 원본 정리(압축 보관 후 삭제)가 아직 없어 DB 에 계속 쌓인다(월 약 17MB 추정).
# 06:00 KST = 21:00 UTC 전날. 정각 혼잡을 피해 20:47 UTC 로 둔다. GitHub cron 은 수십 분 늦을 수 있다.
# 필요한 저장소 시크릿: DATA_GO_KR_SERVICE_KEY, DATABASE_URL (Supabase Session pooler, 5432)
# 러너에서 Supabase 직접 접속(psql)은 아직 실제로 검증하지 못했다. 첫 실행은 수동(workflow_dispatch)으로 확인할 것.
name: daily-snapshot

on:
  schedule:
    - cron: "47 20 * * *"
  workflow_dispatch:
    inputs:
      regions:
        description: "sudogwon | seoul | gyeonggi | incheon | 코드 목록"
        default: "sudogwon"
      dry_run:
        description: "DB 에 쓰지 않고 API 만 확인"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: daily-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: psql 확인
        run: |
          command -v psql || (sudo apt-get update -q && sudo apt-get install -y -q postgresql-client)
          psql --version
      - name: 수집
        env:
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          HC_DB_BACKEND: psql
          PYTHONUNBUFFERED: "1"
          REGIONS: ${{ inputs.regions || 'sudogwon' }}
          DRY_RUN: ${{ inputs.dry_run && '--dry-run' || '' }}
        run: python -m jobs.daily --regions "$REGIONS" $DRY_RUN
