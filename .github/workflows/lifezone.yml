# 생활권 묶음 E0 (jobs/lifezone.py). 단지 좌표·역·행정동 인접·2020년 이후 매매로 분기마다 다시 만든다.
# 다시 만들면 zone_id 가 바뀌므로 metrics 를 이어서 돌려 E3·B6 를 새 생활권으로 계산한다.
name: lifezone

on:
  schedule:
    - cron: "41 20 5 1,4,7,10 *"   # 분기 첫 달 6일 05:41 KST
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lifezone
  cancel-in-progress: false

jobs:
  lifezone:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: psql 확인
        run: command -v psql || (sudo apt-get update -q && sudo apt-get install -y -q postgresql-client)
      - name: 생활권
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          HC_DB_BACKEND: psql
          PYTHONUNBUFFERED: "1"
        run: python -m jobs.lifezone --hist-dir data/raw/hist
      - name: 지표 다시 계산 (E3·B6)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          HC_DB_BACKEND: psql
          PYTHONUNBUFFERED: "1"
        run: python -m jobs.metrics
